services:
  postgres:
    image: postgres:16-alpine
    container_name: safeher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeher
      POSTGRES_PASSWORD: safeher_dev_password
      POSTGRES_DB: safeher
    ports:
      - "5432:5432"
    volumes:
      - safeher_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeher -d safeher"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    container_name: safeher-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://safeher:safeher_dev_password@postgres:5432/safeher?schema=public
      JWT_ACCESS_SECRET: change-me-in-development
      JWT_REFRESH_SECRET: change-me-in-development
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  safeher_postgres_data:
